databases:
  - name: clearwell-db
    databaseName: clearwell
    user: clearwell
    plan: free

services:
  - type: web
    name: clearwell-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh -c "npx node-pg-migrate up && npm run start"
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: clearwell-db
          property: connectionString
      - key: API_KEY_HASH_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: PSP_CALLBACK_SECRET
        generateValue: true
      - key: WEBHOOK_SIGNING_SECRET
        generateValue: true
