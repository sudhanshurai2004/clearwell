services:
  db:
    image: postgres:16-alpine
    container_name: clearwell-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clearwell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clearwell_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-clearwell}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - clearwell-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clearwell} -d ${POSTGRES_DB:-clearwell}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  clearwell-pgdata:
